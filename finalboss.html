<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>蛇族幻想 - 諸神黃昏 (致命劇毒版)</title>
    <style>
        :root { --red: #ff0033; --purple: #d100ff; --gold: #ffd700; --bg: #050000; --cyan: #00ffff; }
        body, html { margin: 0; padding: 0; background: var(--bg); overflow: hidden; font-family: "Microsoft JhengHei", sans-serif; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .boss-ui { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 80%; text-align: center; }
        #phase-label { color: var(--red); font-size: 18px; letter-spacing: 5px; margin-bottom: 5px; font-weight: bold; text-shadow: 0 0 15px var(--red); }
        #boss-hp-bar { width: 100%; height: 15px; background: #200; border: 1px solid #444; }
        #boss-hp-fill { width: 100%; height: 100%; background: var(--red); box-shadow: 0 0 25px var(--red); transition: 0.1s; }
        .player-status { position: absolute; bottom: 30px; right: 30px; text-align: right; color: #fff; }
        #p-hp-bar { width: 220px; height: 12px; background: #111; border: 1px solid var(--gold); margin-top: 5px; }
        #p-hp-fill { width: 100%; height: 100%; background: var(--gold); }
        #dialog-box { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); width: 60%; background: rgba(0, 0, 0, 0.98); border: 2px solid var(--red); padding: 25px; color: #fff; font-size: 20px; z-index: 100; }
        #death-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20,0,30,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        .restart-btn { background: #fff; color: #000; border: none; padding: 15px 45px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 0 20px #fff; }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-layer">
    <div id="boss-ui-group" class="boss-ui">
        <div id="phase-label">PHASE 1: THE ANCIENT SERPENT (DEADLY POISON)</div>
        <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    </div>
    <div class="player-status">
        <div id="poison-warn" style="color:#00ff66; display:none; font-weight:bold;">☠️ 劇毒侵蝕中 ☠️</div>
        <div style="font-size:14px; color:cyan;">聖水🧪: <span id="p-potions">99</span></div>
        <div id="p-hp-bar"><div id="p-hp-fill"></div></div>
    </div>
</div>

<div id="dialog-box">
    <div id="dialog-name" style="color:var(--red); font-weight:bold; font-size:24px; margin-bottom:10px;">耶夢加得</div>
    <div id="dialog-text">這每一滴雨，都流淌著足以腐蝕靈魂的劇毒...</div>
</div>

<div id="death-screen">
    <div id="end-title" style="color:white; font-size:48px; letter-spacing:10px;">你被毒雨溶解了</div>
    <button class="restart-btn" onclick="location.reload()">復活再戰</button>
</div>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let w, h;
    const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener('resize', resize); resize();

    const WORLD = { width: 3000, height: 3000 };
    let camX = 0, camY = 0, inDialog = true, currentBoss = 1, transitioning = false, gameWon = false;
    let bullets = [], bossBullets = [], keys = {};

    let player = { 
        x: WORLD.width/2, y: WORLD.height*0.7, 
        hp: 2000, maxHp: 2000, potions: 99, 
        size: 18, dead: false, iframe: 0, 
        shootCooldown: 0, poison: 0 
    };

    let boss = { 
        x: WORLD.width/2, y: 500, 
        hp: 150000, maxHp: 150000, 
        parts: [], color: "#ff0033", 
        state: 'normal', timer: 0, angle: 0, laserAngle: 0,
        aiTimer: 0, mode: 'chase'
    };
    for(let i=0; i<60; i++) boss.parts.push({x: boss.x, y: boss.y});

    function nextDialog() {
        if (currentBoss === 1 && !transitioning) {
            inDialog = false; document.getElementById('dialog-box').style.display = 'none';
        } else if (transitioning) {
            currentBoss = 2; transitioning = false; inDialog = false;
            document.getElementById('dialog-box').style.display = 'none';
            initBoss2();
        }
    }

    function initBoss2() {
        boss.hp = 800000; boss.maxHp = 800000;
        boss.color = "#d100ff"; boss.state = 'normal';
        document.getElementById('phase-label').innerText = "ULTIMATE BOSS: NIDHOGG THE VOID";
        document.getElementById('phase-label').style.color = "var(--purple)";
        document.getElementById('boss-hp-fill').style.background = "var(--purple)";
    }

    function update() {
        if(inDialog || player.dead || gameWon) return;

        if(player.iframe > 0) player.iframe--;
        if(player.poison > 0) {
            player.poison--;
            if(player.poison % 15 === 0) player.hp -= 40; // 中毒跳血
        }
        document.getElementById('poison-warn').style.display = player.poison > 0 ? 'block' : 'none';

        let pSpeed = 8;
        if(keys['KeyW']) player.y -= pSpeed; if(keys['KeyS']) player.y += pSpeed;
        if(keys['KeyA']) player.x -= pSpeed; if(keys['KeyD']) player.x += pSpeed;
        player.x = Math.max(20, Math.min(WORLD.width-20, player.x));
        player.y = Math.max(20, Math.min(WORLD.height-20, player.y));
        camX = player.x - w/2; camY = player.y - h/2;
        camX = Math.max(0, Math.min(WORLD.width-w, camX)); camY = Math.max(0, Math.min(WORLD.height-h, camY));

        if(keys['Space'] && player.shootCooldown <= 0) {
            [-0.2, -0.1, 0, 0.1, 0.2].forEach(a => {
                bullets.push({ x: player.x, y: player.y, vx: Math.sin(a)*28, vy: -Math.cos(a)*28, life: 80 });
            });
            player.shootCooldown = 12; 
        }
        if(player.shootCooldown > 0) player.shootCooldown--;

        bullets.forEach((b, i) => {
            let head = boss.parts[0];
            let targetA = Math.atan2(head.y - b.y, head.x - b.x);
            let curA = Math.atan2(b.vy, b.vx);
            b.vx = Math.cos(curA + (targetA-curA)*0.3) * 30;
            b.vy = Math.sin(curA + (targetA-curA)*0.3) * 30;
            b.x += b.vx; b.y += b.vy;
            if(Math.hypot(b.x-head.x, b.y-head.y) < 70) {
                boss.hp -= 200; 
                bullets.splice(i, 1);
            } else if(--b.life <= 0) bullets.splice(i, 1);
        });

        // --- Boss 1 AI (強化移動與劇毒攻擊) ---
        let head = boss.parts[0];
        if (currentBoss === 1) {
            boss.aiTimer++;
            let dist = Math.hypot(player.x - head.x, player.y - head.y);
            let a = Math.atan2(player.y - head.y, player.x - head.x);
            let rage = boss.hp < boss.maxHp * 0.5 ? 1.5 : 1.0;

            if (boss.aiTimer % 120 === 0) {
                let rand = Math.random();
                if (rand < 0.4) boss.mode = 'chase';
                else if (rand < 0.7) boss.mode = 'stay';
                else boss.mode = 'strafe';
            }

            if (boss.mode === 'chase') {
                head.x += Math.cos(a) * (6 * rage); 
                head.y += Math.sin(a) * (6 * rage);
            } else if (boss.mode === 'strafe') {
                head.x += Math.cos(a + Math.PI/2) * (8 * rage); 
                head.y += Math.sin(a + Math.PI/2) * (8 * rage);
            } else if (boss.mode === 'stay') {
                if (boss.aiTimer % Math.floor(8 / rage) === 0) {
                    for(let i=0; i<12; i++) {
                        let ang = (i/12)*Math.PI*2 + (boss.aiTimer * 0.15);
                        bossBullets.push({x: head.x, y: head.y, vx: Math.cos(ang)*9, vy: Math.sin(ang)*9, color: "#00ff66", isPoison: true});
                    }
                }
            }

            boss.angle += 0.08 * rage;
            if (Date.now() % Math.floor(300 / rage) < 30) {
                for(let i=0; i<28; i++) {
                    let ang = (i/28)*Math.PI*2 + boss.angle;
                    bossBullets.push({x: head.x, y: head.y, vx: Math.cos(ang)*8, vy: Math.sin(ang)*8, color: "red", isPoison: true});
                }
            }
            if (boss.hp <= 0) { transitioning = true; inDialog = true; document.getElementById('dialog-box').style.display = 'block'; }
        } else {
            // Boss 2 AI
            let dist = Math.hypot(player.x - head.x, player.y - head.y);
            let angleToPlayer = Math.atan2(player.y - head.y, player.x - head.x);

            if (boss.state === 'normal') {
                let moveDir = (dist < 450) ? -1 : (dist > 600 ? 1 : 0);
                head.x += Math.cos(angleToPlayer) * 9 * moveDir;
                head.y += Math.sin(angleToPlayer) * 9 * moveDir;
                if (++boss.timer > 45) {
                    let rand = Math.random();
                    if (rand < 0.25) boss.state = 'laser_charge';
                    else if (rand < 0.5) boss.state = 'teleport';
                    else if (rand < 0.75) boss.state = 'nova';
                    else boss.state = 'chaos';
                    boss.timer = 0;
                }
            } else if (boss.state === 'laser_charge') {
                boss.laserAngle = angleToPlayer;
                if (++boss.timer > 30) { boss.state = 'laser_fire'; boss.timer = 0; }
            } else if (boss.state === 'laser_fire') {
                let pAngle = Math.atan2(player.y - head.y, player.x - head.x);
                if (Math.abs(pAngle - boss.laserAngle) < 0.15 && player.iframe <= 0) { player.hp -= 50; player.poison = 100; }
                if (boss.timer % 5 === 0) {
                   bossBullets.push({x: head.x, y: head.y, vx: Math.cos(boss.laserAngle+1.2)*12, vy: Math.sin(boss.laserAngle+1.2)*12, color: "white"});
                   bossBullets.push({x: head.x, y: head.y, vx: Math.cos(boss.laserAngle-1.2)*12, vy: Math.sin(boss.laserAngle-1.2)*12, color: "white"});
                }
                if (++boss.timer > 45) { boss.state = 'normal'; boss.timer = 0; }
            } else if (boss.state === 'teleport') {
                let ang = Math.random() * Math.PI * 2;
                head.x = player.x + Math.cos(ang) * 250; head.y = player.y + Math.sin(ang) * 250;
                boss.state = 'striking'; boss.timer = 0;
            } else if (boss.state === 'striking') {
                head.x += Math.cos(angleToPlayer) * 45; head.y += Math.sin(angleToPlayer) * 45;
                if (dist < 80 && player.iframe <= 0) { player.hp -= 500; player.poison = 800; player.iframe = 30; }
                if (++boss.timer > 10) { boss.state = 'normal'; boss.timer = 0; }
            } else if (boss.state === 'nova') {
                for(let i=0; i<80; i++){
                    let a = (i/80)*Math.PI*2;
                    bossBullets.push({x: head.x, y: head.y, vx: Math.cos(a)*13, vy: Math.sin(a)*13, color: "cyan"});
                }
                boss.state = 'normal';
            } else if (boss.state === 'chaos') {
                boss.angle += 0.5;
                for(let i=0; i<8; i++){
                    let a = boss.angle + i;
                    bossBullets.push({x: head.x, y: head.y, vx: Math.cos(a)*10, vy: Math.sin(a)*10, color: "#d100ff"});
                }
                if (++boss.timer > 40) { boss.state = 'normal'; boss.timer = 0; }
            }

            if (boss.hp <= 0 && !gameWon) {
                gameWon = true;
                document.getElementById('death-screen').style.display = 'flex';
                document.getElementById('end-title').innerText = "弒神傳說：彈幕之王";
                document.getElementById('end-title').style.color = "var(--gold)";
            }
        }

        // --- 子彈碰撞 (加入高傷害與毒素判定) ---
        bossBullets.forEach((bb, i) => {
            bb.x += bb.vx; bb.y += bb.vy;
            if(Math.hypot(bb.x-player.x, bb.y-player.y) < 22 && player.iframe <= 0) {
                player.hp -= 300; // 傷害從 180 -> 300
                if(bb.isPoison || currentBoss === 1) player.poison += 200; // 附加毒傷時間
                player.iframe = 20; 
                bossBullets.splice(i, 1);
            } else if (Math.abs(bb.x-player.x) > 1500 || Math.abs(bb.y-player.y) > 1500) {
                bossBullets.splice(i, 1);
            }
        });

        for(let i=boss.parts.length-1; i>0; i--) {
            boss.parts[i].x += (boss.parts[i-1].x - boss.parts[i].x) * 0.35;
            boss.parts[i].y += (boss.parts[i-1].y - boss.parts[i].y) * 0.35;
        }

        if(player.hp <= 0) { player.dead = true; document.getElementById('death-screen').style.display = 'flex'; }
        document.getElementById('boss-hp-fill').style.width = (Math.max(0, boss.hp)/boss.maxHp*100) + "%";
        document.getElementById('p-hp-fill').style.width = (player.hp/player.maxHp*100) + "%";
    }

    function draw() {
        ctx.fillStyle = "#020005"; ctx.fillRect(0, 0, w, h);
        ctx.save(); ctx.translate(-camX, -camY);

        if(!gameWon) {
            if (boss.state === 'laser_fire') {
                ctx.strokeStyle = "white"; ctx.lineWidth = 160; ctx.shadowBlur = 40; ctx.shadowColor = "purple";
                ctx.beginPath(); ctx.moveTo(boss.parts[0].x, boss.parts[0].y);
                ctx.lineTo(boss.parts[0].x + Math.cos(boss.laserAngle)*3000, boss.parts[0].y + Math.sin(boss.laserAngle)*3000);
                ctx.stroke(); ctx.shadowBlur = 0;
            }
            boss.parts.forEach((p, i) => {
                ctx.fillStyle = (boss.state === 'striking') ? "#fff" : (boss.state === 'chaos' ? "white" : boss.color);
                ctx.beginPath(); ctx.arc(p.x, p.y, 65 - i*0.9, 0, Math.PI*2); ctx.fill();
            });
        }

        bullets.forEach(b => {
            ctx.fillStyle = "cyan"; ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, Math.PI*2); ctx.fill();
        });

        bossBullets.forEach(bb => {
            ctx.fillStyle = bb.color; ctx.beginPath(); ctx.arc(bb.x, bb.y, 12, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 10; ctx.shadowColor = bb.color;
        });
        ctx.shadowBlur = 0;

        if(player.iframe % 4 < 2) {
            ctx.fillStyle = player.poison > 0 ? "#00ff66" : "gold";
            ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2); ctx.fill();
        }

        ctx.restore();
        update();
        requestAnimationFrame(draw);
    }

    window.addEventListener('keydown', e => {
        if(inDialog && (e.code==='Space'||e.code==='Enter')) nextDialog();
        keys[e.code] = true;
        if(e.code === 'KeyE' && player.potions > 0) {
            player.hp = Math.min(player.maxHp, player.hp + 1000);
            player.potions--; player.poison = 0;
            document.getElementById('p-potions').innerText = player.potions;
        }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);
    draw();
</script>
</body>
</html>
