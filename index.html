<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炮哲幻想 - 開始界面</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-family: "Noto Serif TC", "serif";
        }

        /* 背景設計：深綠色放射狀漸層，模擬照片中的暗沉氛圍 */
        #title-screen {
            width: 100%; height: 100%;
            background: radial-gradient(circle, #0a1a0a 0%, #000 80%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }

        /* 標題：紅色文字 */
        h1 {
            color: #8b0000;
            font-size: 64px;
            margin: 0;
            letter-spacing: 15px;
            text-shadow: 0 0 15px rgba(139, 0, 0, 0.5);
        }

        /* 副標題 */
        p {
            color: #4e634e;
            font-size: 14px;
            letter-spacing: 4px;
            margin: 10px 0 40px 0;
            text-transform: uppercase;
        }

        /* 開始按鈕：深綠色邊框與文字 */
        .start-btn {
            background: rgba(26, 43, 26, 0.6);
            border: 1px solid #2d442d;
            color: #a5b5a5;
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .start-btn:hover {
            background: #2d442d;
            color: #fff;
            box-shadow: 0 0 10px rgba(78, 99, 78, 0.8);
        }
    </style>
</head>
<body>

    <div id="title-screen">
        <h1>蛇族幻想</h1>
        <p>SNAKE WHISPERER TALES</p>
        
        <a href="lobby.html" class="start-btn">踏入禁地</a>
    </div>

</body>
</html>
