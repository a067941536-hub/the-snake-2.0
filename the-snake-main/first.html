<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>蛇族幻想 - 第一關：十字焦土</title>
    <style>
        :root { --hp-green: #2ecc71; --hp-red: #e74c3c; --dq-blue: #004488; --gold: #d4af37; --poison-purple: #9b59b6; }
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: "Noto Serif TC", serif; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        #minimap-container { position: absolute; top: 20px; left: 20px; width: 120px; height: 120px; border: 2px solid #fff; background: rgba(0,0,0,0.8); pointer-events: auto; }
        #minimap { width: 100%; height: 100%; }
        #floor-tag { position: absolute; bottom: -22px; width: 100%; text-align: center; color: var(--gold); font-size: 12px; font-weight: bold; }

        .status-window { position: absolute; background: rgba(0, 0, 0, 0.85); border: 2px solid #fff; padding: 12px; color: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.8); }
        #player-status { top: 20px; right: 20px; width: 220px; border-right: 5px solid var(--hp-green); text-align: right; }
        #inventory-status { top: 120px; right: 20px; width: 140px; border-right: 5px solid var(--gold); text-align: right; }
        #enemy-status { top: 200px; right: 20px; width: 220px; border-right: 5px solid var(--hp-red); }
        
        .status-icon { display: inline-block; width: 20px; height: 20px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }
        #poison-dot { background: var(--poison-purple); box-shadow: 0 0 10px var(--poison-purple); display: none; }

        #death-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(60, 0, 0, 0.85); display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            pointer-events: auto; z-index: 100;
        }
        .death-btn { padding: 15px 40px; background: #fff; border: none; cursor: pointer; font-size: 20px; font-weight: bold; margin-top: 20px; transition: 0.2s; }

        .hp-bar-bg { width: 100%; height: 12px; background: #333; margin-top: 8px; border: 1px solid #555; overflow: hidden; }
        .hp-fill { height: 100%; background: var(--hp-green); transition: 0.3s; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div id="minimap-container">
            <canvas id="minimap" width="120" height="120"></canvas>
            <div id="floor-tag">第一關：十字焦土</div>
        </div>

        <div id="player-status" class="status-window">
            <div style="font-size: 16px; font-weight: bold;">冒險者 HP <span id="poison-dot" class="status-icon"></span></div>
            <div class="hp-bar-bg"><div id="player-hp-fill" class="hp-fill"></div></div>
        </div>
        <div id="inventory-status" class="status-window">
            <div style="font-size: 14px; color: #d4af37;">聖水🧪 x <span id="potion-count">0</span></div>
            <div style="font-size: 10px; color: #aaa; margin-top: 4px;">按 [ E ] 解毒/補血</div>
        </div>
        <div id="enemy-status" class="status-window">
            <div style="font-size: 16px; font-weight: bold; color: var(--hp-red);">剩餘蛇王: <span id="snake-count-text">3</span></div>
        </div>
        <div id="death-screen">
            <h1 style="color:#fff; font-size: 50px;">你倒下了...</h1>
            <button class="death-btn" onclick="respawn()">回到起點 (保留裝備)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mCanvas = document.getElementById('minimap');
        const mCtx = mCanvas.getContext('2d');

        const config = { tileSize: 80, playerSpeed: 0.05, baseArrowSpeed: 0.3, shootCooldown: 400 };
        
        let savedData = JSON.parse(localStorage.getItem('rpg_save')) || { potions: 0 };

        const player = { 
            x: 4, y: 4, hp: 100, maxHp: 100, 
            potions: savedData.potions, lastShootTime: 0, 
            isInvulnerable: false, alive: true,
            poisoned: false, poisonInterval: null 
        };

        const snakes = [];
        const startPositions = [{x: 35, y: 5}, {x: 35, y: 25}, {x: 5, y: 25}];
        startPositions.forEach(pos => {
            let s = {
                x: pos.x, y: pos.y, hp: 300, maxHp: 300, alive: true,
                isHit: false, stunned: false, stunTimer: null, bodyParts: []
            };
            for(let i=0; i<12; i++) s.bodyParts.push({x: pos.x + i, y: pos.y});
            snakes.push(s);
        });

        const arrows = [];
        const keys = {};
        let portalOpen = false;

        const mapW = 40, mapH = 30;
        const map = Array.from({length: mapH}, () => Array(mapW).fill(0));
        function addWall(x, y, w, h) { for(let i=y; i<y+h; i++) for(let j=x; j<x+w; j++) if(i < mapH && j < mapW) map[i][j] = 1; }
        for(let i=0; i<mapW; i++) { map[0][i]=1; map[mapH-1][i]=1; }
        for(let i=0; i<mapH; i++) { map[i][0]=1; map[i][mapW-1]=1; }
        addWall(10, 14, 20, 2); 
        addWall(19, 5, 2, 20);  
        addWall(8, 6, 2, 2); addWall(30, 6, 2, 2);
        addWall(8, 22, 2, 2); addWall(30, 22, 2, 2);
        map[2][37] = 3; map[27][37] = 3; map[27][2] = 3; map[14][19] = 3;

        function drawMinimap() {
            mCtx.fillStyle = "rgba(0,0,0,0.9)"; mCtx.fillRect(0,0,120,120);
            const scale = 120 / mapW;
            for(let r=0; r<mapH; r++) for(let c=0; c<mapW; c++) {
                if(map[r][c] === 1) { mCtx.fillStyle = "#666"; mCtx.fillRect(c*scale, r*scale, scale, scale); }
                if(map[r][c] === 3) { mCtx.fillStyle = "#0f0"; mCtx.fillRect(c*scale, r*scale, scale, scale); }
            }
            snakes.forEach(s => { if(s.alive) { mCtx.fillStyle = "red"; mCtx.fillRect(s.x*scale, s.y*scale, scale*2, scale*2); } });
            mCtx.fillStyle = "#2ecc71"; mCtx.fillRect(player.x*scale, player.y*scale, scale*2, scale*2);
        }

        function drawPlayer(ctx, x, y) {
            ctx.save(); ctx.translate(x * 80 + 40, y * 80 + 40);
            if(player.isInvulnerable || (player.poisoned && Math.floor(Date.now()/200)%2)) {
                ctx.globalAlpha = 0.5; if(player.poisoned) { ctx.shadowBlur = 20; ctx.shadowColor = "#9b59b6"; }
            } else { ctx.shadowBlur = 15; ctx.shadowColor = "#2ecc71"; }
            ctx.fillStyle = "#2ecc71"; ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-8, -5, 5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -5, 5, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(-8, -5, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(8, -5, 2.5, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        }

        function drawSnake(ctx, s) {
            if(!s.alive) return;
            ctx.save(); const time = Date.now() / 200;
            s.bodyParts.forEach((part, i) => {
                const nx = part.x * 80 + 40;
                const ny = part.y * 80 + 40 + Math.sin(time + i * 0.7) * 10;
                const size = 35 - i * 2;
                ctx.beginPath();
                const grad = ctx.createRadialGradient(nx - size/3, ny - size/3, 0, nx, ny, size);
                grad.addColorStop(0, "#5ce6dd"); grad.addColorStop(1, "#1a4d4a");
                ctx.fillStyle = grad;
                if(s.stunned) { ctx.shadowBlur = 20; ctx.shadowColor = "yellow"; }
                else if(s.isHit) { ctx.shadowBlur = 25; ctx.shadowColor = "red"; }
                ctx.arc(nx, ny, size, 0, Math.PI*2); ctx.fill();
            });
            const head = s.bodyParts[0];
            ctx.translate(head.x * 80 + 40, head.y * 80 + 40 + Math.sin(time) * 10);
            if(s.stunned) { ctx.rotate(time * 6); ctx.fillStyle = "yellow"; ctx.font = "bold 45px Arial"; ctx.fillText("@_@", -40, 15); }
            else {
                ctx.fillStyle = "#3dc1c1"; ctx.beginPath(); ctx.ellipse(0, 0, 38, 48, 0, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(-14, -12, 9, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(14, -12, 9, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(-14, -12, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(14, -12, 4, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "red"; ctx.lineWidth = 3; ctx.beginPath();
                ctx.moveTo(0, 35); ctx.lineTo(0, 55 + Math.sin(time*10)*5); ctx.lineTo(-8, 65);
                ctx.moveTo(0, 55 + Math.sin(time*10)*5); ctx.lineTo(8, 65); ctx.stroke();
            }
            ctx.restore();
        }

        class Arrow {
            constructor(x, y, target) {
                this.x = x; this.y = y; this.life = 120;
                this.isCrit = Math.random() < 0.15;
                this.damage = this.isCrit ? 50 : 25;
                const tx = target ? target.x : x + 1, ty = target ? target.y : y;
                const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy) || 1;
                this.vx = (dx / d) * config.baseArrowSpeed; this.vy = (dy / d) * config.baseArrowSpeed;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life--; }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x * 80, this.y * 80); ctx.rotate(Math.atan2(this.vy, this.vx));
                ctx.strokeStyle = this.isCrit ? "#ff0000" : "#00f2ff"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(15, 0); ctx.stroke(); ctx.restore();
            }
        }

        function respawn() {
            if(player.poisonInterval) clearInterval(player.poisonInterval);
            localStorage.setItem('rpg_save', JSON.stringify({ potions: player.potions }));
            location.reload();
        }

        window.addEventListener('keydown', e => { keys[e.code] = true; if(e.code === 'KeyE') usePotion(); });
        window.addEventListener('keyup', e => { if(e.code === 'Space') handleSpace(); keys[e.code] = false; });

        function handleSpace() {
            if(!player.alive) return;
            const now = Date.now(); if(now - player.lastShootTime < config.shootCooldown) return;
            let closest = null, minDist = 12; 
            snakes.forEach(s => { 
                if(s.alive) { 
                    let d = Math.hypot(s.x-player.x, s.y-player.y); 
                    if(d < minDist) { minDist = d; closest = s; } 
                } 
            });
            arrows.push(new Arrow(player.x, player.y, closest));
            player.lastShootTime = now;
        }

        function usePotion() { 
            if(player.potions > 0 && player.alive) { 
                let used = false;
                if(player.poisoned) { player.poisoned = false; if(player.poisonInterval) clearInterval(player.poisonInterval); used = true; }
                if(player.hp < player.maxHp) { player.hp = Math.min(100, player.hp + 50); used = true; }
                if(used) { player.potions--; updateUI(); }
            } 
        }

        function checkPlayerDeath() {
            if(player.hp <= 0 && player.alive) {
                player.hp = 0; player.alive = false; player.poisoned = false;
                if(player.poisonInterval) clearInterval(player.poisonInterval);
                document.getElementById('death-screen').style.display = 'flex';
                updateUI();
            }
        }

        function update() {
            if (player.alive) {
                let mx = 0, my = 0;
                if (keys['KeyW']) my -= config.playerSpeed; if (keys['KeyS']) my += config.playerSpeed;
                if (keys['KeyA']) mx -= config.playerSpeed; if (keys['KeyD']) mx += config.playerSpeed;
                
                if (map[Math.floor(player.y + my)][Math.floor(player.x)] !== 1) player.y += my;
                if (map[Math.floor(player.y)][Math.floor(player.x + mx)] !== 1) player.x += mx;
                
                if(map[Math.floor(player.y)][Math.floor(player.x)] === 3) { 
                    player.potions++; 
                    map[Math.floor(player.y)][Math.floor(player.x)] = 0; 
                    updateUI();
                }

                // --- 已移除提示框，直接跳轉 ---
                if(portalOpen && player.x > 37 && Math.abs(player.y - 15) < 2) {
                    localStorage.setItem('rpg_save', JSON.stringify({ potions: player.potions }));
                    window.location.href = 'second.html';
                    return;
                }
            }

            for (let i = arrows.length - 1; i >= 0; i--) {
                let arr = arrows[i];
                arr.update();
                let hasHit = false;

                for (let j = 0; j < snakes.length; j++) {
                    let s = snakes[j];
                    if(s.alive && Math.hypot(arr.x - s.x, arr.y - s.y) < 1.2) {
                        s.hp -= arr.damage; 
                        s.isHit = true;
                        if (Math.random() < 0.1) { 
                            s.stunned = true; 
                            clearTimeout(s.stunTimer); 
                            s.stunTimer = setTimeout(() => { if(s) s.stunned = false; }, 1000); 
                        }
                        setTimeout(() => { if(s) s.isHit = false; }, 150);
                        if(s.hp <= 0) s.alive = false;
                        hasHit = true; break;
                    }
                }

                if(hasHit || arr.life <= 0 || map[Math.floor(arr.y)][Math.floor(arr.x)] === 1) {
                    arrows.splice(i, 1);
                }
            }

            let aliveCount = 0;
            snakes.forEach(s => {
                if(!s.alive) return;
                aliveCount++;
                
                if(!s.stunned) {
                    const head = s.bodyParts[0];
                    const dx = player.x - head.x, dy = player.y - head.y, dist = Math.hypot(dx, dy);
                    let speed = player.alive ? (dist > 8 ? 0.06 : 0.03) : 0;
                    
                    if(map[Math.floor(head.y)][Math.floor(head.x + (dx/dist)*speed)] !== 1) head.x += (dx/dist)*speed;
                    if(map[Math.floor(head.y + (dy/dist)*speed)][Math.floor(head.x)] !== 1) head.y += (dy/dist)*speed;
                    
                    for(let i = s.bodyParts.length - 1; i > 0; i--) {
                        s.bodyParts[i].x += (s.bodyParts[i-1].x - s.bodyParts[i].x) * 0.18;
                        s.bodyParts[i].y += (s.bodyParts[i-1].y - s.bodyParts[i].y) * 0.18;
                    }
                    s.x = head.x; s.y = head.y;

                    if (player.alive && dist < 0.6 && !player.isInvulnerable) {
                        player.hp -= 15; player.isInvulnerable = true;
                        setTimeout(() => player.isInvulnerable = false, 800);
                        if(!player.poisoned && Math.random() < 0.4) {
                            player.poisoned = true;
                            if(player.poisonInterval) clearInterval(player.poisonInterval);
                            player.poisonInterval = setInterval(() => { 
                                if(player.poisoned && player.alive) { 
                                    player.hp -= 2; updateUI(); checkPlayerDeath();
                                } 
                            }, 1000);
                        }
                        checkPlayerDeath();
                    }
                }
            });

            if(aliveCount === 0) portalOpen = true;
            document.getElementById('snake-count-text').innerText = aliveCount;
            updateUI(); 
            drawMinimap();
        }

        function updateUI() {
            const hpf = document.getElementById('player-hp-fill');
            if(hpf) {
                hpf.style.width = Math.max(0, player.hp) + "%";
                hpf.style.background = player.poisoned ? "var(--poison-purple)" : "var(--hp-green)";
            }
            document.getElementById('poison-dot').style.display = player.poisoned ? "inline-block" : "none";
            document.getElementById('potion-count').innerText = player.potions;
        }

        function draw() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const camX = player.x * 80 - canvas.width / 2, camY = player.y * 80 - canvas.height / 2;
            
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-camX, -camY);
            
            for(let r=0; r<mapH; r++) for(let c=0; c<mapW; c++) {
                const x = c*80, y = r*80;
                if(map[r][c] === 1) { 
                    ctx.fillStyle = '#222'; ctx.fillRect(x, y, 80, 80); 
                    ctx.strokeStyle='#333'; ctx.strokeRect(x+5,y+5,70,70); 
                } else { 
                    ctx.fillStyle = '#0f0505'; ctx.fillRect(x, y, 80, 80); 
                    ctx.strokeStyle='#1a0a0a'; ctx.strokeRect(x,y,80,80); 
                }
                if(map[r][c] === 3) { 
                    ctx.shadowBlur=15; ctx.shadowColor="lime"; ctx.fillStyle="lime"; 
                    ctx.beginPath(); ctx.arc(x+40,y+40,15,0,Math.PI*2); ctx.fill(); 
                    ctx.shadowBlur=0; 
                }
            }
            
            if(portalOpen) { 
                ctx.shadowBlur = 30; ctx.shadowColor = "cyan"; 
                ctx.fillStyle = "rgba(0, 255, 255, 0.4)"; 
                ctx.beginPath(); ctx.arc(38*80, 15*80, 100, 0, Math.PI*2); ctx.fill(); 
                ctx.shadowBlur = 0;
            }

            arrows.forEach(arr => arr.draw(ctx));
            snakes.forEach(s => drawSnake(ctx, s));
            if(player.alive) drawPlayer(ctx, player.x, player.y);
            
            ctx.restore(); 
            update(); 
            requestAnimationFrame(draw);
        }
        
        draw();
    </script>
</body>
</html>
